<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient for Title -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>

    <!-- CSS Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      .pill-float-1 { animation: floatSlow 7s ease-in-out infinite; }
      .pill-float-2 { animation: floatFast 6s ease-in-out infinite 1s; }
      .pill-float-3 { animation: floatSlow 8s ease-in-out infinite 2s; }
      .pill-float-4 { animation: floatFast 7.5s ease-in-out infinite 0.5s; }
      .glowing-node { animation: pulseGlow 4s ease-in-out infinite alternate; }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 25s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Animated Background Orbs / Glows -->
  <g class="glowing-node">
    <circle cx="180" cy="90" r="140" fill="url(#glowCyan)" />
    <circle cx="1020" cy="110" r="160" fill="url(#glowPurple)" />
    <circle cx="600" cy="340" r="150" fill="url(#glowEmerald)" />
  </g>

  <!-- Background Decorative Flow Lines -->
  <path class="flow-line" d="M 50 120 Q 300 30 600 110 T 1150 100" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" />
  <path class="flow-line" d="M 80 270 Q 400 330 750 260 T 1130 290" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="2" />

  <!-- Dynamic / Floating Peripheral Badges (positioned around edges, NEVER obscuring center text) -->
  <g class="pill-float-1" transform="translate(60, 48)">
    <rect width="165" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="34" y="22" fill="#e2e8f0" class="badge-text">⚡ Real-time CRDT</text>
  </g>

  <g class="pill-float-2" transform="translate(970, 52)">
    <rect width="170" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#c084fc" />
    <text x="34" y="22" fill="#e2e8f0" class="badge-text">📚 Docs as Code</text>
  </g>

  <g class="pill-float-3" transform="translate(70, 305)">
    <rect width="180" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="34" y="22" fill="#e2e8f0" class="badge-text">🛡️ 100% Self-Hosted</text>
  </g>

  <g class="pill-float-4" transform="translate(965, 305)">
    <rect width="175" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(244, 114, 182, 0.45)" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#f472b6" />
    <text x="34" y="22" fill="#e2e8f0" class="badge-text">🤖 AI Knowledge Base</text>
  </g>

  <!-- Central Foreground Content Card (Ensures Title & Subtitle Stay Crisp & Visible in Front) -->
  <g transform="translate(140, 95)">
    <!-- Backing highlight panel -->
    <rect width="920" height="185" rx="18" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Header Mini Badge -->
    <g transform="translate(340, 18)">
      <rect width="240" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="120" y="17" fill="#7dd3fc" class="badge-text" text-anchor="middle" font-size="11.5">⭐ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="460" y="82" text-anchor="middle" class="title-text" font-size="34" fill="url(#titleGrad)">
      Awesome Knowledge Base &amp; Help Content Server
    </text>

    <!-- Subtitle -->
    <text x="460" y="118" text-anchor="middle" class="sub-text" font-size="16" fill="#cbd5e1">
      Top SaaS Platforms &amp; Open-Source Projects for Collaborative Wikis, Help Centers &amp; Internal Docs
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(200, 142)">
      <rect x="0" y="0" width="105" height="25" rx="12.5" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="52" y="16" fill="#94a3b8" class="badge-text" text-anchor="middle" font-size="11">📖 Team Wikis</text>

      <rect x="120" y="0" width="125" height="25" rx="12.5" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="182" y="16" fill="#94a3b8" class="badge-text" text-anchor="middle" font-size="11">🎫 Help Centers</text>

      <rect x="260" y="0" width="135" height="25" rx="12.5" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="327" y="16" fill="#94a3b8" class="badge-text" text-anchor="middle" font-size="11">🔐 Data Sovereignty</text>

      <rect x="410" y="0" width="115" height="25" rx="12.5" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="467" y="16" fill="#94a3b8" class="badge-text" text-anchor="middle" font-size="11">🚀 Git &amp; Markdown</text>
    </g>
  </g>
</svg>
